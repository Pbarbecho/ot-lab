# ot-lab — servicio OPCIONAL: dashboard de la Práctica 1 (Modbus TCP, pymodbus y OpenPLC)
#
# No modifica los otros compose: se SUMA a cualquiera de ellos con un segundo -f.
#   macOS / WSL:  docker compose -f docker-compose.yml         -f docker-compose.dashboard.yml up -d --build
#   Windows:      docker compose -f docker-compose.windows.yml -f docker-compose.dashboard.yml up -d --build
#   Quitarlo:     docker compose -f docker-compose.yml -f docker-compose.dashboard.yml rm -sf dashboard
#
# Con restart: unless-stopped arranca solo cada vez que arranca Docker, como el resto del laboratorio.
# Abrir:  http://localhost:8000      Documentación: dashboard/README.md y dashboard/README.html
#
# Seguridad: monta /var/run/docker.sock (control total de Docker) y su API ejecuta Python
# dentro del contenedor ot-client; por eso se publica SOLO en 127.0.0.1. No exponer a la red.

services:
  dashboard:
    build: ./dashboard
    image: ot-lab-dashboard
    container_name: ot-dashboard
    restart: unless-stopped
    # Red «bridge» por defecto de Docker: no crea redes nuevas ni ocupa IPs de 172.28.0.0/24.
    # No la necesita: todo lo hace con docker exec/logs/run a través del socket.
    network_mode: bridge
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./modbus:/ot-lab/modbus        # «Cargar tablero» reescribe server.json
      - ./captures:/ot-lab/captures    # pcap guardados por el dashboard
    environment:
      OT_NETWORK: ot-lab_ot-lab
    depends_on:
      - modbus-sim
      - openplc
