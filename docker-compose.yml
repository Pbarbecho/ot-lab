# ot-lab — un solo compose para macOS, Windows 10/11 (Docker Desktop + WSL 2) y Linux
#
#   docker compose up -d        (Terminal, PowerShell o WSL, dentro de la carpeta ot-lab)
#
# Arquitectura: se detecta sola. Docker descarga la variante amd64 o arm64 de cada imagen;
#  solo openplc y conpot publican únicamente amd64 y llevan platform: linux/amd64
#  (en Apple Silicon / Windows ARM corren emuladas; en Mac active "Use Rosetta" en
#  Docker Desktop > Settings > General para mejor rendimiento).
#
# Persistencia local: FUXA y Node-RED guardan sus proyectos en ./fuxa-data y ./nodered-data
#  (bind mounts, visibles y respaldables en el disco). Ignition usa un volumen con nombre
#  porque la imagen necesita sembrar su data/ inicial.
#
# Notas por sistema:
#  - Todos: el host alcanza los servicios por localhost:<puerto publicado>; las IPs
#    172.28.0.x solo funcionan entre contenedores.
#  - Windows: clone dentro de WSL (\\wsl$\Ubuntu\home\<usuario>\ot-lab) y no en C:\Users\...
#    (los bind mounts sobre NTFS son lentos). Los archivos montados deben tener fin de
#    línea LF (lo fuerza .gitattributes; Mosquitto no arranca con CRLF).
#  - Windows: si el puerto 50000 falla con "An attempt was made to access a socket in a way
#    forbidden", está en un rango reservado por Hyper-V (netsh interface ipv4 show
#    excludedportrange protocol=tcp): cambie el mapeo a "4850:50000".
#  - Linux nativo: Node-RED corre con uid 1000; si su usuario no es el 1000, ejecute una vez
#    sudo chown -R 1000:1000 nodered-data

name: ot-lab

volumes:
  ignition-data:

networks:
  ot-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  modbus-sim:
    image: oitc/modbus-server:latest
    container_name: modbus-sim
    restart: unless-stopped
    command: -f /server_config.json
    volumes:
      - ./modbus/server.json:/server_config.json:ro
    ports: ["5020:5020"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.30 }

  modbus-explorer:
    build: ./modbus-explorer
    container_name: modbus-explorer
    restart: unless-stopped
    # Taller 5 · prácticas 1a y 1b: pymodbus desde el navegador, tablero animado (lámina 31),
    # tramas MBAP+PDU, captura tcpdump → Wireshark, autoprogramación y Monitoring de OpenPLC.
    environment:
      TZ: "America/Guayaquil"
      OPENPLC_URL: "http://172.28.0.10:8080"
      OPENPLC_USER: "openplc"
      OPENPLC_PASS: "openplc"
    volumes:
      - ./modbus:/app/modbus                       # server.json y tablero.json: el editor «Modbus server» los escribe
      - ./captures:/app/captures                   # las capturas .pcap quedan en la carpeta compartida
      - /var/run/docker.sock:/var/run/docker.sock  # solo para «Guardar y reiniciar modbus-sim» (quítelo si no lo quiere)
    ports: ["8500:8500"]
    depends_on: [modbus-sim]
    networks:
      ot-lab: { ipv4_address: 172.28.0.40 }

  openplc:
    image: tuttas/openplc_v3
    platform: linux/amd64          # imagen solo amd64
    container_name: openplc
    restart: unless-stopped
    ports: ["8080:8080", "502:502"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.10 }

  opc-plc:
    image: mcr.microsoft.com/iotedge/opc-plc:latest
    container_name: opc-plc
    restart: unless-stopped
    command: >
      --pn=50000 --autoaccept --sph --sn=5 --sr=10 --st=uint
      --fn=5 --fr=1 --ft=uint --gn=5 --ut --dca
    ports: ["50000:50000"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.20 }

  opcua-py:
    build: ./opcua
    container_name: opcua-py
    restart: unless-stopped
    ports: ["4840:4840"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.21 }

  ignition:
    image: inductiveautomation/ignition:latest
    container_name: ignition
    restart: unless-stopped
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_PASSWORD: "lab1234!"
      IGNITION_EDITION: "standard"
    volumes:
      # Volumen con nombre, no bind mount: la imagen necesita sembrar su data/ inicial
      - ignition-data:/usr/local/bin/ignition/data
    ports: ["8088:8088"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.50 }

  fuxa:
    image: frangoteam/fuxa:latest
    container_name: fuxa
    restart: unless-stopped
    volumes:
      - ./fuxa-data:/usr/src/app/FUXA/server/_appdata     # proyectos FUXA en el disco local
    ports: ["1881:1881"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.51 }

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: unless-stopped
    volumes:
      - ./nodered-data:/data                             # flujos Node-RED en el disco local
    ports: ["1880:1880"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.52 }

  conpot:
    image: honeynet/conpot:latest
    platform: linux/amd64          # imagen solo amd64
    container_name: conpot
    restart: unless-stopped
    # La imagen no tiene ENTRYPOINT y el binario no está en PATH: usar ruta completa y -f (foreground)
    command: ["/home/conpot/.local/bin/conpot", "--template", "default", "--logfile", "/var/log/conpot/conpot.log", "-f", "--temp_dir", "/tmp"]
    # La plantilla default de Conpot NO usa los puertos estándar: Modbus 5020, S7comm 10201, HTTP 8800, SNMP 16100 (ver conpot.log). HTTP en 18800 porque Chrome bloquea el 10080 (ERR_UNSAFE_PORT)
    ports: ["10502:5020", "10102:10201", "18800:8800", "10161:16100/udp"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.90 }

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports: ["1883:1883"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.60 }
