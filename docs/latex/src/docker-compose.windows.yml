# ot-lab — versión para Windows 10/11 (Docker Desktop con backend WSL 2)
#
# Uso (PowerShell o CMD, dentro de la carpeta ot-lab):
#   docker compose -f docker-compose.windows.yml up -d
#   docker compose -f docker-compose.windows.yml ps
#   docker compose -f docker-compose.windows.yml logs -f <servicio>
#
# Diferencias respecto a la versión macOS:
#  - Volúmenes con nombre para Ignition, FUXA y Node-RED: evita problemas de permisos
#    (uid 1000) y de rendimiento de los bind mounts sobre NTFS (/mnt/c).
#  - Solo se montan como bind mount los dos archivos de configuración (server.json,
#    mosquitto.conf). DEBEN tener fin de línea LF, no CRLF: Mosquitto falla con CRLF.
#    Si clonaste con Git en Windows: git config core.autocrlf false  (o usa el .gitattributes).
#  - Puerto 50000 (OPC PLC): en Windows puede caer en el rango dinámico reservado por
#    Hyper-V/WSL. Si "docker compose up" falla con "bind: An attempt was made to access a
#    socket in a way forbidden by its access permissions", comprueba con
#      netsh interface ipv4 show excludedportrange protocol=tcp
#    y cambia el mapeo a "4850:50000" (y usa opc.tcp://localhost:4850 en UaExpert).
#  - platform: linux/amd64 se mantiene en openplc y conpot (inocuo en PC Intel/AMD;
#    necesario en Windows ARM).
#  - Recomendado: clonar el proyecto DENTRO del sistema de archivos de WSL
#    (\\wsl$\Ubuntu\home\<usuario>\ot-lab) y no en C:\Users\..., por rendimiento.
#  - Captura de tráfico: no existe interfaz br-xxxx visible; usar netshoot
#    (docker run --rm --net container:<svc> nicolaka/netshoot tshark -i eth0 ...).
#  - El host alcanza los servicios solo por localhost:<puerto publicado>;
#    las IPs 172.28.0.x solo funcionan entre contenedores.

name: ot-lab

volumes:
  ignition-data:
  fuxa-data:
  nodered-data:

networks:
  ot-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  modbus-sim:
    image: oitc/modbus-server:latest
    container_name: modbus-sim
    restart: unless-stopped
    command: -f /server_config.json
    volumes:
      - ./modbus/server.json:/server_config.json:ro
    ports: ["5020:5020"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.30 }

  openplc:
    image: tuttas/openplc_v3
    platform: linux/amd64
    container_name: openplc
    restart: unless-stopped
    ports: ["8080:8080", "502:502"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.10 }

  opc-plc:
    image: mcr.microsoft.com/iotedge/opc-plc:latest
    container_name: opc-plc
    restart: unless-stopped
    command: >
      --pn=50000 --autoaccept --sph --sn=5 --sr=10 --st=uint
      --fn=5 --fr=1 --ft=uint --gn=5 --ut --dca
    ports: ["50000:50000"]      # si el puerto está reservado en Windows: "4850:50000"
    networks:
      ot-lab: { ipv4_address: 172.28.0.20 }

  opcua-py:
    build: ./opcua
    container_name: opcua-py
    restart: unless-stopped
    ports: ["4840:4840"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.21 }

  ignition:
    image: inductiveautomation/ignition:latest
    container_name: ignition
    restart: unless-stopped
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_PASSWORD: "lab1234!"
      IGNITION_EDITION: "standard"
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
    ports: ["8088:8088"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.50 }

  fuxa:
    image: frangoteam/fuxa:latest
    container_name: fuxa
    restart: unless-stopped
    volumes:
      - fuxa-data:/usr/src/app/FUXA/server/_appdata
    ports: ["1881:1881"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.51 }

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: unless-stopped
    volumes:
      - nodered-data:/data
    ports: ["1880:1880"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.52 }

  conpot:
    image: honeynet/conpot:latest
    platform: linux/amd64
    container_name: conpot
    restart: unless-stopped
    # La imagen no tiene ENTRYPOINT y el binario no está en PATH: ruta completa y -f (foreground)
    command: ["/home/conpot/.local/bin/conpot", "--template", "default", "--logfile", "/var/log/conpot/conpot.log", "-f", "--temp_dir", "/tmp"]
    ports: ["10502:502", "10102:102", "10080:80", "10161:161/udp"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.90 }

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports: ["1883:1883"]
    networks:
      ot-lab: { ipv4_address: 172.28.0.60 }
